<section class="portal-nav">
    <div class="login-container">
        <div class="modal-header">
            <h2>AUTENTIFICACIÓN </h2>
        </div>


        <form class="login-form">
            <div class="form-group">
                <label for="control-no" class="form-label">Usuario:</label>
                <input type="text" id="control-no" name="control-no" class="form-input" [(ngModel)]="usuario">
            </div>

            <div class="form-group">
                <label for="nip" class="form-label">Clave:
                </label>
                <input type="password" id="nip" name="nip" class="form-input" [(ngModel)]="password">
            </div>

            <button type="button" class="submit-btn" (click)="onLogin()">Iniciar Sesión</button>
        </form>
    </div>
</section>
