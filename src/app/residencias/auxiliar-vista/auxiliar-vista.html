<app-fondo>
    <div class="Container">
        <div class="Principal">
            <div class="SearchSection">
                <label class="search-label">Buscar:</label>
                <div class="search-input-wrapper">
                    <div class="search-input-placeholder">xx04xxxx</div>
                    <div class="search-underline"></div>
                </div>
            </div>

            <div class="SubPrincipal">
                <h2 class="section-title">Alumnos Disponibles:</h2>
                <div class="table-wrapper">
                    <ag-grid-angular style="width: 100%; height: 400px;" class="ag-theme-quartz" [rowData]="rowData"
                        [columnDefs]="colDefs" [defaultColDef]="defaultColDef">
                    </ag-grid-angular>
                </div>
            </div>
        </div>
    </div>
</app-fondo>
